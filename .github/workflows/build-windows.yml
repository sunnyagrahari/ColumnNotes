name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained win-x64
        run: >
          dotnet publish native/src/ColumnNotes/ColumnNotes.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/publish

      - name: Stamp portable folder
        run: powershell -File portable/make-portable.ps1

      - name: Upload portable zip (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ColumnNotes-portable-win-x64
          path: artifacts/ColumnNotes-portable-win-x64.zip

      - name: Publish GitHub Release with EXE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.1.1"
          $notes = @"
          ColumnNotes 1.1.1 — portable Windows build (startup crash fix).

          1.1.0 died on launch because the tab strip attached the same UI element twice.
          1.1.1 starts normally: tabs, renameable columns, colored sections, Select All, checkbox toggle.

          1. Download ColumnNotes-portable-win-x64.zip
          2. Unzip
          3. Double-click ColumnNotes.exe

          If Windows SmartScreen appears: More info → Run anyway.
          "@
          gh release delete $tag --yes 2>$null
          gh release create $tag `
            "artifacts/ColumnNotes-portable-win-x64.zip" `
            "artifacts/publish/ColumnNotes.exe" `
            --title "ColumnNotes 1.1.1" `
            --notes $notes
